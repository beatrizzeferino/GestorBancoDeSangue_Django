{% load static %}
<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    
</head>
<body>

    {% if messages %}
        <div class="mensagens-alerta">
            {% for message in messages %}
                <div class="alerta {{ message.tags }}">
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="container"> 
        <div id="login" class="cartao">
            <div class="avatar">
                <i class="fas fa-user"></i>
            </div>
            
            <form id="formLogin" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="input-group">
                    <i class="fas fa-user"></i> 
                    <input type="text" name="username" placeholder="Nome de Utilizador" required autofocus>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="passLogin" placeholder="Palavra-passe" required>
                </div>
                
                <button type="submit">LOGIN</button>
            </form>
        </div>

    </div>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
